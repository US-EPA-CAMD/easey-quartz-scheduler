applications:
  - name: ((name))
    memory: ((memory))
    instances: ((instances))
    buildpacks:
      - dotnet_core_buildpack
    health-check-type: ((healthCheckType))
    env:
      PUBLISH_RELEASE_CONFIG: true
      OPTIMIZE_MEMORY: true
      CACHE_NUGET_PACKAGES: false
      EASEY_AUTH_API: https://((apiGatewayHost))/auth-mgmt
      EASEY_CAMD_SERVICES: https://((apiGatewayHost))/camd-services
      EASEY_STREAMING_SERVICES: https://((apiGatewayHost))/streaming-services
      EASEY_QUARTZ_SCHEDULER_TITLE: ((title))
      EASEY_QUARTZ_SCHEDULER_HOST: ((host))
      EASEY_QUARTZ_SCHEDULER_ENV: ((environment))
      EASEY_QUARTZ_SCHEDULER_BULK_DATA_S3_BUCKET: ((bulkDataS3Bucket))
      EASEY_QUARTZ_SCHEDULER_CHECK_ENGINE_DLL_PATH: ((checkEngineDllPath))
      EASEY_DATAMART_BYPASS: false
      EASEY_EMISSIONS_NIGHTLY_BYPASS: true
      EASEY_QUARTZ_SCHEDULER_DISPLAY_UI: ((displayUI))
      EASEY_QUARTZ_SCHEDULER_DB_REPLICA_ENABLED: ((dbReplicaEnabled))
      EASEY_QUARTZ_SCHEDULER_BULK_BUFFER_SIZE: ((bulkBufferSize))
      EASEY_QUARTZ_SCHEDULER_MAX_BULK_FILE_JOBS: ((maxBulkFileJobs))
      EASEY_QUARTZ_SCHEDULER_MAX_CHECK_THREADS: ((maxCheckThreads))
      EASEY_QUARTZ_SCHEDULER_MAX_MP_EVALUATIONS: ((maxMpEvaluations))
      EASEY_QUARTZ_SCHEDULER_MAX_QA_EVALUATIONS: ((maxQaEvaluations))
      EASEY_QUARTZ_SCHEDULER_MAX_EM_EVALUATIONS: ((maxEmEvaluations))
      EASEY_QUARTZ_SCHEDULER_MAX_SUBMISSION_JOBS: ((maxSubmissionJobs))
      EASEY_QUARTZ_SCHEDULER_MAX_EMAILS_TO_SEND: ((maxEmailsToSend))
      EASEY_QUARTZ_SCHEDULER_MASS_EVALUATION_EMAIL: ((massEvaluationEmail))
      EASEY_QUARTZ_SCHEDULER_WINDOW_NOTIFICATION_FROM_EMAIL: ((windowNotificationFromEmail))
      EASEY_QUARTZ_SCHEDULER_SUBMISSION_ERROR_FROM_EMAIL: ((submissionErrorFromEmail))
      EASEY_QUARTZ_SCHEDULER_EMAIL_PROCESS_MAX_RETRIES: ((emailProcessMaxRetries))
      EASEY_QUARTZ_SCHEDULER_BULK_FILE_JOB_QUEUE_DELAY: ((bulkFileJobQueueDelay))
      EASEY_QUARTZ_SCHEDULER_EMAIL_QUEUE_DELAY: ((emailQueueDelay))
      EASEY_QUARTZ_SCHEDULER_EVALUATION_JOB_QUEUE_DELAY: ((evaluationJobQueueDelay))
      EASEY_QUARTZ_SCHEDULER_SUBMISSION_JOB_QUEUE_DELAY: ((submissionJobQueueDelay))
      EASEY_DB_MAX_CONNECTION_POOL: ((maxConnectionPool))
      EASEY_DB_IDLE_TIMEOUT: ((idleTimeout))
      EASEY_DB_CONNECTION_TIMEOUT: ((connectionTimeout))
      EASEY_DB_COMMAND_TIMEOUT: ((commandTimeout))
      EASEY_DB_STATEMENT_TIMEOUT: ((statementTimeout))
      EASEY_DB_IDLE_TRANS_SESSION_TIMEOUT: ((idleInTransactionSessionTimeout))
      EASEY_DB_CONNECTION_LIFE_TIME: ((connectionLifeTime))
      EASEY_LOG_LEVEL: ((logLevel))
    routes:
      - route: ((host))/((path))
    services:
      - camd-pg-db
      - log-drain
